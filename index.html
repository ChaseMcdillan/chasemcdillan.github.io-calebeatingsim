<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="styles.css">

<body>

<h1>🍔 Caleb Eating Sim 🍕</h1>

<div class="panel">

    <h2>Food: <span id="food">0</span></h2>

    <p>Food/sec: <span id="fps">0</span></p>

    <p>Total Eaten: <span id="eaten">0</span></p>

    <p>Reputation: <span id="reputation">0</span></p>

<button id="eatBtn">
    Eat 1 Food
</button>

<h2>Buildings</h2>

<div id="buildings"></div>

<h2>Ferrari Shop</h2>

<button onclick="buyDoubleFood()">
    x2 Food Production (25 Ferraris)
</button>

<script src="main.js"></script>

</body>
